openapi: 3.0.0
info:
  version: 1.0.0
  title: API de Itens
  termsOfService: https://www.empresa.com.br/termos
  contact:
    name: Suporte Técnico
    email: suporte@empresa.com.br
    url: https://www.empresa.com.br/suporte
  license:
    name: Licença MIT
    url: https://opensource.org/licenses/MIT
  description: >
    API REST para cadastro, consulta, listagem, atualização e exclusão de itens.
    Ideal para sistemas que precisam gerenciar catálogos simples.

servers:
  - url: http://localhost:8080
    description: Servidor local de desenvolvimento

tags:
  - name: Itens
    description: Operações relacionadas aos itens

paths:
  /items:
    post:
      summary: Criar um novo item
      description: Cria um novo item com os dados fornecidos no corpo da requisição.
      operationId: criarItem
      tags:
        - Itens
      requestBody:
        description: Representação do item a ser criado
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
            examples:
              exemplo:
                value:
                  name: Caneta Azul
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Requisição inválida. Verifique os dados enviados.

    get:
      summary: Listar todos os itens
      description: Retorna uma lista com todos os itens cadastrados.
      operationId: listarItens
      tags:
        - Itens
      responses:
        '200':
          description: Lista de todos os itens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemResponse'
        '500':
          description: Erro interno ao buscar itens.

  /items/{id}:
    get:
      summary: Buscar item por ID
      description: Retorna os dados de um item específico a partir do seu identificador.
      operationId: buscarItemPorId
      tags:
        - Itens
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do item
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Item encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          description: Item não encontrado

    put:
      summary: Atualizar um item existente
      description: Atualiza os dados de um item existente com base no ID informado.
      operationId: atualizarItem
      tags:
        - Itens
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do item
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        description: Dados atualizados do item
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
            examples:
              exemplo:
                value:
                  name: Lápis Preto
      responses:
        '200':
          description: Item atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Dados inválidos
        '404':
          description: Item não encontrado

    delete:
      summary: Excluir um item
      description: Exclui permanentemente um item com base no ID informado.
      operationId: excluirItem
      tags:
        - Itens
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do item
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Item excluído com sucesso
        '404':
          description: Item não encontrado

components:
  schemas:
    ItemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Nome do item
          minLength: 1
          maxLength: 100
          example: Borracha
      description: Representação de entrada de um item

    ItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do item
          example: 10
        name:
          type: string
          description: Nome do item
          example: Caderno Universitário
      description: Representação de saída de um item
